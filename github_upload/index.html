<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>佐須 バス到着案内</title>

<!-- ホーム画面に追加した時の見た目・挙動の設定 -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c47a1b">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="佐須バス">

<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f5f1;
    --panel-hover: #efece5;
    --border: #e4e0d8;
    --text: #23262b;
    --muted: #767d87;
    --amber: #c47a1b;
    --good: #2f9e52;
    --good-soft: #e6f6ea;
    --delay: #d0472b;
    --delay-soft: #fbe8e3;
    --early: #1d8fa6;
    --early-soft: #e3f3f6;
    --muted-soft: #edeef0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  main {
    width: 100%;
    max-width: 430px;
    padding: 28px 20px 40px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 0 0 4px;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 24px;
    font-weight: 700;
    color: var(--text);
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    padding: 8px 0;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .back:hover { color: var(--text); }

  .option-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-align: left;
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .option-btn:hover { background: var(--panel-hover); }
  .option-btn:active { transform: scale(0.99); }

  .option-btn.disabled {
    color: var(--muted);
    cursor: not-allowed;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .option-btn.disabled:hover { background: var(--panel); }

  .tag {
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .board {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .row .route {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .row .time {
    font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
    font-size: 26px;
    font-weight: 700;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }

  .row .minutes {
    font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
    font-size: 13px;
    color: var(--text);
    margin-top: 2px;
  }

  .status {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status.good  { background: var(--good-soft);  color: var(--good); }
  .status.delay { background: var(--delay-soft); color: var(--delay); }
  .status.early { background: var(--early-soft); color: var(--early); }
  .status.muted { background: var(--muted-soft); color: var(--muted); }

  .footer-note {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  .empty, .error {
    color: var(--muted);
    font-size: 14px;
    padding: 24px 4px;
    text-align: center;
  }
  .error { color: var(--delay); }
</style>
</head>
<body>
<main>
  <p class="eyebrow" id="eyebrow">佐須 バス到着案内</p>
  <h1 id="title">どこへ行きますか？</h1>
  <div id="content"></div>
  <p class="footer-note" id="footerNote"></p>
</main>

<script>
  // フロントエンドとバックエンド(server.py)が同じサーバーから配信される前提なので、
  // API_BASEは空文字(=今開いているページと同じ場所)にしておく。
  const API_BASE = "";

  let busData = null;
  let view = { screen: "company" }; // company -> direction -> result

  async function fetchBuses() {
    const res = await fetch(`${API_BASE}/buses`);
    if (!res.ok) throw new Error(`サーバーエラー(${res.status})`);
    return res.json();
  }

  function statusClass(status) {
    if (status.includes("遅れ")) return "delay";
    if (status.includes("早着")) return "early";
    if (status.includes("情報なし")) return "muted";
    if (status.includes("定刻")) return "good";
    return "muted";
  }

  function render() {
    const eyebrow = document.getElementById("eyebrow");
    const title = document.getElementById("title");
    const content = document.getElementById("content");
    const footerNote = document.getElementById("footerNote");
    content.innerHTML = "";
    footerNote.textContent = "";

    if (!busData) {
      eyebrow.textContent = "佐須 バス到着案内";
      title.textContent = "読み込み中…";
      return;
    }

    const companies = [...new Set(busData.routes.map(r => r.company))];

    if (view.screen === "company") {
      eyebrow.textContent = "佐須 バス到着案内";
      title.textContent = "どこへ行きますか？会社を選んでください";

      const list = document.createElement("div");
      list.className = "option-list";

      companies.forEach(company => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = company;
        btn.onclick = () => { view = { screen: "direction", company }; render(); };
        list.appendChild(btn);
      });

      (busData.paused_companies || []).forEach(company => {
        const btn = document.createElement("div");
        btn.className = "option-btn disabled";
        btn.innerHTML = `<span>${company}</span><span class="tag">準備中</span>`;
        list.appendChild(btn);
      });

      content.appendChild(list);
      return;
    }

    if (view.screen === "direction") {
      eyebrow.textContent = view.company;
      title.textContent = "どちら方面ですか？";

      const back = document.createElement("button");
      back.className = "back";
      back.textContent = "← 会社選択に戻る";
      back.onclick = () => { view = { screen: "company" }; render(); };
      content.appendChild(back);

      const list = document.createElement("div");
      list.className = "option-list";

      busData.routes
        .filter(r => r.company === view.company)
        .forEach(r => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = r.direction;
          btn.onclick = () => {
            view = { screen: "result", company: view.company, direction: r.direction };
            render();
          };
          list.appendChild(btn);
        });

      content.appendChild(list);
      return;
    }

    if (view.screen === "result") {
      eyebrow.textContent = view.company;
      title.textContent = view.direction;

      const back = document.createElement("button");
      back.className = "back";
      back.textContent = "← 方面選択に戻る";
      back.onclick = () => { view = { screen: "direction", company: view.company }; render(); };
      content.appendChild(back);

      const routeData = busData.routes.find(
        r => r.company === view.company && r.direction === view.direction
      );

      if (!routeData || routeData.buses.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "本日はこれ以降の便がありません";
        content.appendChild(empty);
      } else {
        const board = document.createElement("div");
        board.className = "board";
        routeData.buses.forEach(bus => {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <div>
              <div class="route">${bus.route_name}系統</div>
              <div class="time">${bus.arrival_time}</div>
              <div class="minutes">あと${bus.minutes_from_now}分</div>
            </div>
            <span class="status ${statusClass(bus.status)}">${bus.status}</span>
          `;
          board.appendChild(row);
        });
        content.appendChild(board);
      }

      if (busData.realtime_cache_updated_at) {
        const t = new Date(busData.realtime_cache_updated_at).toLocaleTimeString("ja-JP");
        footerNote.textContent = `リアルタイム情報 最終更新: ${t}`;
      }
      return;
    }
  }

  async function refresh() {
    try {
      busData = await fetchBuses();
      render();
    } catch (e) {
      document.getElementById("eyebrow").textContent = "佐須 バス到着案内";
      document.getElementById("title").textContent = "接続できません";
      document.getElementById("content").innerHTML =
        `<p class="error">サーバーに接続できませんでした。<br>
        サーバーが起動しているか確認してください。</p>`;
    }
  }

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
